alertmanager:
  config:
    global:
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_from: 'chaudharyritik24@gmail.com'
      smtp_auth_username: 'chaudharyritik24@gmail.com'
      smtp_auth_password: 'znfc nwrr mull jpze'
      smtp_require_tls: true

    route:
      receiver: email
      group_by:
        - namespace
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h

      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"

    receivers:
      - name: "null"

      - name: email
        email_configs:
          - to: 'null'
            send_resolved: true

    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity =~ warning|info
        equal:
          - namespace
          - alertname

      - source_matchers:
          - severity = warning
        target_matchers:
          - severity = info
        equal:
          - namespace
          - alertname

      - source_matchers:
          - alertname = InfoInhibitor
        target_matchers:
          - severity = info
        equal:
          - namespace

      - target_matchers:
          - alertname = InfoInhibitor
