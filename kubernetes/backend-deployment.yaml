apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devops

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:

      - name: backend
        image: chritik24/devops-backend:latest
        imagePullPolicy: Always


        ports:
        - containerPort: 5000

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3

        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3

        env:

        - name: PORT
          value: "5000"

        - name: DB_HOST
          value: mysql

        - name: DB_USER
          value: devops

        - name: DB_PASSWORD
          value: devops123

        - name: DB_NAME
          value: shopdb
